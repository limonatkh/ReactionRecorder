name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ReactionRecorder.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: ReactionRecorder
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ReactionRecorder-apk
          path: ReactionRecorder/app/build/outputs/apk/debug/*.apk
      - name: Publish APK to the apk-out branch
        run: |
          mkdir -p /tmp/out && cp ReactionRecorder/app/build/outputs/apk/debug/app-debug.apk /tmp/out/ReactionRecorder.apk
          cd /tmp/out
          git init -q -b apk-out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ReactionRecorder.apk
          git commit -q -m "APK from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-out
